[workspace]
resolver = "2"
members = ["crates/core", "crates/geometry", "crates/desktop", "crates/drafting_core", "crates/drafting_interop", "crates/geotech_core", "crates/geotech_report", "crates/geotech_jobs", "crates/geotech_host", "crates/structural_core", "crates/foundation_core", "crates/structural_configurator", "crates/geo_core"]
exclude = ["deps/viewer_core"]

[workspace.package]
version = "0.5.1"
edition = "2024"
license = "MIT"

[workspace.dependencies]
ai_revit_core = { path = "crates/core" }
geo_core = { path = "crates/geo_core" }
geotech_core = { path = "crates/geotech_core" }
geotech_report = { path = "crates/geotech_report" }
geotech_jobs = { path = "crates/geotech_jobs" }
geotech_host = { path = "crates/geotech_host" }
structural_core = { path = "crates/structural_core" }
foundation_core = { path = "crates/foundation_core" }
structural_configurator = { path = "crates/structural_configurator" }
ai_revit_geometry = { path = "crates/geometry" }
viewer_core = { path = "deps/viewer_core" }
makepad-widgets = { path = "../../.deps/makepad/widgets", version = "2.0.0" }
makepad-xr = { path = "../../.deps/makepad/xr", version = "1.0.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
png = "0.18.1"


drafting_core = { path = "crates/drafting_core" }
drafting_interop = { path = "crates/drafting_interop" }
sha2 = "0.10"

# Public, repository-local dependencies. No operator-specific SDK paths.
toolkit-windows-automation = { path = "../../crates/toolkit-windows-automation" }
